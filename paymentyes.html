<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت موفق</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #7b92be 0%, #183972 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .success-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }

        .blue-header {
            background: linear-gradient(120deg, #1e3c72, #2a5298);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .success-icon {
            font-size: 60px;
            background: rgb(50, 130, 92);
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleUp 0.5s ease;
        }

        @keyframes scaleUp {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .blue-header h3 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .blue-header p {
            font-size: 13px;
            opacity: 0.9;
            margin: 0;
        }

        .content-body {
            padding: 25px;
        }

        .success-msg {
            background: #e8f4ff;
            border-right: 3px solid #28a745;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-msg i {
            color: #28a745;
            margin-left: 8px;
        }

        .success-msg strong {
            color: #1e3c72;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #6c757d;
        }

        .info-value {
            color: #1e3c72;
            font-weight: 600;
        }

        .info-value.amount {
            color: #28a745;
            font-size: 16px;
        }

        .btn-download {
            background: linear-gradient(120deg, #1e3c72, #2a5298);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30,60,114,0.3);
        }

        .btn-download:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-home {
            background: transparent;
            border: 1.5px solid #dee2e6;
            padding: 10px;
            border-radius: 50px;
            color: #6c757d;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-home:hover {
            border-color: #2a5298;
            color: #2a5298;
        }

        @media (max-width: 480px) {
            .content-body {
                padding: 20px;
            }
            
            .blue-header {
                padding: 25px 20px;
            }
            
            .success-icon {
                width: 80px;
                height: 80px;
                font-size: 45px;
            }
        }

        .toast-container-custom {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #1e3c72;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast-container-custom.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-container-custom i {
            font-size: 20px;
            color: #28a745;
        }

        #receiptCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="blue-header">
            <div class="success-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h3>پرداخت موفق</h3>
            <p>تراکنش شما با موفقیت انجام شد</p>
        </div>

        <div class="content-body">
            <div class="success-msg">
                <i class="bi bi-check-circle-fill"></i>
                <strong>پرداخت شما تایید شد!</strong> از خرید شما متشکریم
            </div>

            <div class="info-row">
                <span class="info-label">مبلغ پرداختی:</span>
                <span class="info-value amount">۱,۲۵۰,۰۰۰ تومان</span>
            </div>
            <div class="info-row">
                <span class="info-label">شماره پیگیری:</span>
                <span class="info-value">TRX-8942</span>
            </div>
            <div class="info-row">
                <span class="info-label">شماره مرجع:</span>
                <span class="info-value">REF-20241205-8942</span>
            </div>
            <div class="info-row">
                <span class="info-label">تاریخ پرداخت:</span>
                <span class="info-value">۱۴۰۲/۰۹/۱۵ - ۱۵:۳۰</span>
            </div>

            <button class="btn-download" onclick="downloadReceiptPNG()">
                <i class="bi bi-download"></i> دریافت رسید
            </button>
            <a href="index.html" class="btn-home">
                <i class="bi bi-house-door"></i> بازگشت به صفحه اصلی
            </a>
        </div>
    </div>

    <canvas id="receiptCanvas" width="800" height="1200"></canvas>

    <div class="toast-container-custom" id="toastNotification">
        <i class="bi bi-check-circle-fill"></i>
        <span id="toastMessage">رسید با موفقیت دانلود شد</span>
    </div>

    <script>
        function downloadReceiptPNG() {
            const btn = event.target.closest('.btn-download');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> در حال آماده سازی...';
            btn.disabled = true;

            setTimeout(() => {
                try {
                    const canvas = document.getElementById('receiptCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.strokeStyle = '#1e3c72';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
                    
                    const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
                    gradient.addColorStop(0, '#1e3c72');
                    gradient.addColorStop(1, '#2a5298');
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.roundRect(20, 20, canvas.width - 40, 140, 20);
                    ctx.fill();
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(20, 20, canvas.width - 40, 140);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 42px Tahoma, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('رسید پرداخت', canvas.width / 2, 95);
                    
                    ctx.fillStyle = '#6c757d';
                    ctx.font = '24px Tahoma, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('شماره پیگیری: TRX-8942', canvas.width / 2, 175);
                    
                    ctx.strokeStyle = '#e9ecef';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(60, 210);
                    ctx.lineTo(canvas.width - 60, 210);
                    ctx.stroke();
                    
                    const rows = [
                        { label: 'تاریخ:', value: '۱۴۰۲/۰۹/۱۵ - ۱۵:۳۰' },
                        { label: 'شماره مرجع:', value: 'REF-20241205-8942' },
                        { label: 'پرداخت کننده:', value: 'علی محمدی' },
                        { label: 'شرح تراکنش:', value: 'خرید از فروشگاه' }
                    ];
                    
                    let yPos = 260;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    
                    rows.forEach(row => {
                        ctx.fillStyle = '#6c757d';
                        ctx.font = '24px Tahoma, sans-serif';
                        ctx.fillText(row.label, canvas.width / 2 - 30, yPos);
                        
                        ctx.fillStyle = '#1e3c72';
                        ctx.font = 'bold 26px Tahoma, sans-serif';
                        ctx.fillText(row.value, canvas.width - 70, yPos);
                        
                        yPos += 60;
                    });
                    
                    ctx.strokeStyle = '#e9ecef';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(60, yPos + 10);
                    ctx.lineTo(canvas.width - 60, yPos + 10);
                    ctx.stroke();
                    
                    yPos += 50;
                    
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#6c757d';
                    ctx.font = '28px Tahoma, sans-serif';
                    ctx.fillText('مبلغ:', canvas.width / 2 - 30, yPos);
                    
                    ctx.fillStyle = '#28a745';
                    ctx.font = 'bold 38px Tahoma, sans-serif';
                    ctx.fillText('۱,۲۵۰,۰۰۰ تومان', canvas.width - 70, yPos);
                    
                    yPos += 80;
                    
                    ctx.strokeStyle = '#e9ecef';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(60, yPos);
                    ctx.lineTo(canvas.width - 60, yPos);
                    ctx.stroke();
                    
                    yPos += 50;
                    
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#6c757d';
                    ctx.font = '20px Tahoma, sans-serif';
                    ctx.fillText('این رسید به منزله قبض پرداخت می‌باشد.', canvas.width / 2, yPos);
                    
                    yPos += 45;
                    ctx.fillStyle = '#6c757d';
                    ctx.font = '18px Tahoma, sans-serif';
                    ctx.fillText('کد رهگیری: 8942-2024', canvas.width / 2, yPos);
                    
                    yPos += 45;
                    ctx.fillStyle = '#adb5bd';
                    ctx.font = '16px Tahoma, sans-serif';
                    ctx.fillText('تایید شده توسط سامانه پرداخت', canvas.width / 2, yPos);
                    
                    yPos += 50;
                    
                    ctx.strokeStyle = '#e9ecef';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(60, yPos);
                    ctx.lineTo(canvas.width - 60, yPos);
                    ctx.stroke();
                    
                    yPos += 40;
                    
                    ctx.fillStyle = '#adb5bd';
                    ctx.font = '16px Tahoma, sans-serif';
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('fa-IR');
                    ctx.fillText(`تاریخ چاپ: ${dateStr}`, canvas.width / 2, yPos);
                    
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2 + 50);
                    ctx.rotate(-25 * Math.PI / 180);
                    ctx.fillStyle = 'rgba(30, 60, 114, 0.04)';
                    ctx.font = 'bold 70px Tahoma, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('رسید پرداخت', 0, 0);
                    ctx.restore();
                    
                    canvas.toBlob(function(blob) {
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `رسید-پرداخت-${new Date().getTime()}.png`;
                        document.body.appendChild(link);
                        link.click();
                        
                        setTimeout(() => {
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        }, 100);
                        
                        showToast('رسید PNG با موفقیت دانلود شد ✅');
                        
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }, 'image/png');
                    
                } catch (error) {
                    console.error('Error generating PNG:', error);
                    showToast('خطا در تولید رسید ❌');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 500);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
