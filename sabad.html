<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>سبد خرید</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a2f3a; 
            color: #eef4ff;
            line-height: 1.5;
            padding-bottom: 0;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .ocean-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: radial-gradient(circle at 30% 20%, #136b8f, #07405c, #02161f);
        }
        .sun-rays {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 30% 20%, rgba(130, 210, 240, 0.12) 0%, rgba(70, 150, 200, 0) 70%);
            pointer-events: none;
            animation: raysMove 22s infinite alternate;
        }
        @keyframes raysMove {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.45; transform: scale(1.08); }
        }
        .bubbles {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(170, 225, 255, 0.7), rgba(60, 160, 210, 0.25));
            border-radius: 50%;
            animation: bubbleUp linear infinite;
        }
        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }
        #oceanCanvas {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            z-index: -1;
            pointer-events: none;
            display: block;
            opacity: 0.85;
        }

        .footer-iframe {
            width: 100%;
            border: none;
            display: block;
            background: transparent;
            min-height: 200px;
            margin-top: 2rem;
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px;
        }
        .cart-main {
            margin-top: 70px;
            padding-bottom: 2rem;
            flex: 1;
        }

        .product-card {
            background: rgba(255, 255, 252, 0.9);
            border-radius: 1.5rem;
            border: none;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 8px 18px rgba(0, 32, 48, 0.08);
            margin-bottom: 1.2rem;
            overflow: hidden;
            color: #0a2b3e;
            padding: 1rem 1.25rem;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 30px rgba(9, 65, 85, 0.15);
            background: #ffffff;
        }

        .product-img {
            background: #bfd9e8;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            width: 75px;
            height: 75px;
            margin: 0 auto;
            font-size: 2rem;
            color: #1f5e7a;
            overflow: hidden;
            flex-shrink: 0;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-title {
            font-weight: 700;
            font-size: 1rem;
            color: #0b3b4b;
            margin-bottom: 0.15rem;
        }
        .product-category {
            font-size: 0.7rem;
            background: #e4f1f9;
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            color: #136b8d;
            font-weight: 500;
        }
        .price-text {
            font-weight: 800;
            color: #135e7c;
            font-size: 1rem;
            white-space: nowrap;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f7fc;
            padding: 0.2rem 0.5rem;
            border-radius: 2rem;
            width: fit-content;
            margin: 0 auto;
        }
        .quantity-btn {
            background: #ffffff;
            border: 1px solid #cbdde8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1;
            transition: 0.2s;
            color: #115a78;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .quantity-btn:hover {
            background: #115a78;
            color: white;
            border-color: #115a78;
        }
        .quantity-btn:active {
            transform: scale(0.9);
        }
        .quantity-num {
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            font-size: 0.95rem;
        }

        .remove-item {
            color: #b15e4a;
            background: transparent;
            border: none;
            font-size: 1.1rem;
            transition: 0.2s;
            cursor: pointer;
            padding: 4px 8px;
            flex-shrink: 0;
        }
        .remove-item:hover {
            color: #d13b1c;
            transform: scale(1.1);
        }

        .cart-item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .cart-item-col-image {
            flex: 0 0 75px;
        }
        .cart-item-col-info {
            flex: 1;
            min-width: 0;
        }
        .cart-item-col-quantity {
            flex: 0 0 auto;
        }
        .cart-item-col-price {
            flex: 0 0 auto;
            min-width: 80px;
            text-align: center;
        }
        .cart-item-col-remove {
            flex: 0 0 auto;
        }

        .summary-card {
            background: rgba(254, 252, 245, 0.95);
            border-radius: 1.8rem;
            box-shadow: 0 12px 28px rgba(0, 38, 54, 0.1);
            border: 1px solid #deeef7;
            padding: 1.5rem;
            position: sticky;
            top: 20px;
            color: #0a2b3e;
        }
        .summary-title {
            font-family: 'Playfair Display', serif;
            border-bottom: 2px dashed #3f92b2;
            display: inline-block;
            padding-bottom: 0.3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            color: #145d7a;
        }
        .total-row {
            border-top: 2px solid #cae3ef;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            font-weight: 800;
            font-size: 1.3rem;
            color: #0b4e68;
        }
        .btn-checkout {
            background: linear-gradient(95deg, #1c6d8c, #0f4b64);
            border: none;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 2rem;
            transition: all 0.3s;
            color: white;
            width: 100%;
            margin-top: 1rem;
            cursor: pointer;
        }
        .btn-checkout:hover {
            background: linear-gradient(95deg, #0f5f7c, #0a3f54);
            transform: scale(0.98);
            box-shadow: 0 6px 14px rgba(0, 55, 75, 0.3);
        }
        .btn-checkout:active {
            transform: scale(0.95);
        }
        .empty-cart {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 245, 0.85);
            border-radius: 2rem;
            color: #0a2b3e;
        }
        .btn-secondary-clear {
            background-color: #cedce6;
            color: #1c5a72;
            border: none;
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary-clear:hover {
            background-color: #bdd2e2;
            transform: scale(0.95);
        }
        .btn-secondary-clear:active {
            transform: scale(0.9);
        }

        .ocean-header {
            background: linear-gradient(135deg, #1a6d8f, #0e5a7a, #07455e);
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1000;
            flex-shrink: 0;
        }
        .header-content {
            padding: 1rem 1rem 1.2rem;
        }
        .main-navbar {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 80px;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .navbar-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .desktop-logo-wrapper, .desktop-site-name {
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .desktop-logo-wrapper:hover, .desktop-site-name:hover { transform: scale(1.02); }
        .brand-logo-img {
            height: 44px;
            width: auto;
            max-width: 60px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
            display: block;
        }
        .special-logo {
            filter: drop-shadow(0 0 8px rgba(71, 200, 224, 0.6));
            transition: all 0.3s ease;
        }
        .special-logo:hover {
            filter: drop-shadow(0 0 15px rgba(71, 200, 224, 0.9));
            transform: scale(1.03);
        }
        .brand-text-desktop {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.55rem;
            background: linear-gradient(135deg, #ffffff, #d4f1ff, #a3e4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }
        .desktop-menu {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: nowrap;
            justify-content: center;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0.2rem 0;
        }
        .nav-link-custom {
            color: white !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 50px;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: none;
            border: none;
            position: relative;
            text-decoration: none !important;
        }
        .nav-link-custom::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 50%;
            transform: translateX(50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #47c8e0, #aae0ff);
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        .nav-link-custom:hover::after {
            width: 70%;
        }
        .nav-link-custom:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .nav-link-custom.active::after {
            width: 70%;
        }
        .cart-desktop {
            background: rgba(255, 255, 255, 0.15) !important;
            border-radius: 50px;
            padding: 0.5rem 1rem !important;
        }
        .cart-desktop i { margin: 0; font-size: 1rem; }
        .cart-desktop span { display: none; }
        .cart-desktop:hover {
            background: rgba(255, 255, 255, 0.3) !important;
            transform: scale(1.05);
        }
        .mobile-brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mobile-brand-group .brand-text-mobile {
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #ffffff, #d4f1ff, #a3e4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }
        .mobile-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .mobile-menu-btn, .mobile-cart-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .mobile-menu-btn { padding: 0.55rem 1rem; font-size: 1.3rem; }
        .mobile-cart-btn { width: 44px; height: 44px; font-size: 1.2rem; }
        .mobile-menu-btn:hover, .mobile-cart-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.03);
        }
        @media (min-width: 993px) {
            .mobile-brand-group, .mobile-buttons { display: none !important; }
            .desktop-logo-wrapper, .desktop-site-name, .desktop-menu { display: flex; }
        }
        @media (max-width: 992px) {
            .desktop-logo-wrapper, .desktop-site-name, .desktop-menu { display: none !important; }
            .mobile-brand-group, .mobile-buttons { display: flex !important; }
            .main-navbar { padding: 0.5rem 1rem; }
        }
        @media (max-width: 1200px) {
            .desktop-menu { gap: 0.1rem; }
            .nav-link-custom { padding: 0.4rem 0.7rem !important; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .mobile-brand-group .brand-text-mobile { font-size: 1rem; }
            .mobile-brand-group .brand-logo-img { height: 32px; max-width: 42px; }
            .mobile-cart-btn { width: 40px; height: 40px; }
            .mobile-menu-btn { padding: 0.45rem 0.8rem; }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ocean-header { animation: fadeInDown 0.6s ease-out; }

        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99999;
            backdrop-filter: blur(8px);
        }
        .mobile-menu-overlay.active {
            display: block;
        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            right: -340px;
            width: 320px;
            height: 100vh;
            background: linear-gradient(180deg, #043a4f, #0a5a78, #07455e);
            z-index: 100000;
            padding: 30px 20px;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .mobile-sidebar.open {
            right: 0;
        }
        .mobile-sidebar .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.8rem;
            padding: 5px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        .mobile-sidebar .close-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: rotate(90deg);
        }
        .mobile-sidebar .sidebar-brand {
            margin-top: 40px;
            margin-bottom: 30px;
            text-align: center;
        }
        .mobile-sidebar .sidebar-brand img {
            height: 60px;
            filter: drop-shadow(0 0 20px rgba(71,200,224,0.3));
        }
        .mobile-sidebar .sidebar-brand h2 {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
            background: linear-gradient(135deg, #ffffff, #a3e4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .mobile-sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            color: white;
            text-decoration: none;
            border-radius: 16px;
            transition: 0.3s;
            margin: 6px 0;
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .mobile-sidebar .menu-item:last-child {
            border-bottom: none;
        }
        .mobile-sidebar .menu-item:hover {
            background: rgba(71,200,224,0.15);
            transform: translateX(-5px);
        }
        .mobile-sidebar .menu-item i {
            width: 28px;
            color: #47c8e0;
            font-size: 1.2rem;
        }

        @media (max-width: 992px) {
            .cart-item-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            .cart-item-col-image {
                flex: 0 0 60px;
            }
            .product-img {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
            .cart-item-col-info {
                flex: 1 1 100%;
                order: 2;
            }
            .cart-item-col-quantity {
                order: 3;
                flex: 0 0 auto;
            }
            .cart-item-col-price {
                order: 4;
                flex: 0 0 auto;
                min-width: 70px;
            }
            .cart-item-col-remove {
                order: 5;
                flex: 0 0 auto;
            }
            .footer-iframe { min-height: 300px; }
        }

        @media (max-width: 768px) {
            .cart-main {
                margin-top: 60px;
            }
            .product-card {
                padding: 0.8rem 0.8rem !important;
            }
            .product-img {
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
            }
            .product-title {
                font-size: 0.85rem;
            }
            .price-text {
                font-size: 0.85rem;
            }
            .summary-card {
                margin-top: 1.5rem;
                padding: 1rem;
            }
            .cart-toast {
                width: 90%;
                font-size: 0.85rem;
                padding: 10px 16px;
            }
            .quantity-control {
                padding: 0.15rem 0.4rem;
                gap: 4px;
            }
            .quantity-btn {
                width: 24px;
                height: 24px;
                font-size: 0.85rem;
            }
            .quantity-num {
                min-width: 24px;
                font-size: 0.85rem;
            }
            .remove-item {
                font-size: 0.95rem;
                padding: 2px 6px;
            }
            .cart-item-col-price {
                min-width: 60px;
            }
            .footer-iframe { min-height: 300px; }
        }

        @media (max-width: 480px) {
            .product-img {
                width: 48px;
                height: 48px;
                font-size: 1.1rem;
            }
            .cart-item-col-image {
                flex: 0 0 48px;
            }
            .product-title {
                font-size: 0.8rem;
            }
            .product-category {
                font-size: 0.6rem;
                padding: 0.1rem 0.4rem;
            }
            .price-text {
                font-size: 0.75rem;
            }
            .quantity-btn {
                width: 22px;
                height: 22px;
                font-size: 0.75rem;
            }
            .quantity-num {
                min-width: 20px;
                font-size: 0.75rem;
            }
            .cart-item-col-price {
                min-width: 50px;
            }
            .cart-item-col-quantity {
                flex: 0 0 auto;
            }
            .cart-item-row {
                gap: 4px;
            }
            .footer-iframe { min-height: 350px; }
        }

        .cart-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            background: rgba(46, 125, 50, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            font-weight: 500;
            animation: slideDown 0.5s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .cart-toast.error {
            background: rgba(211, 47, 47, 0.95);
        }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="ocean-bg"></div>
<div class="sun-rays"></div>
<canvas id="oceanCanvas"></canvas>
<div class="bubbles" id="bubbleContainer"></div>

<header class="ocean-header">
    <div class="header-content">
        <div class="main-navbar">
            <div class="navbar-flex">
                <div class="desktop-logo-wrapper" onclick="sendNavigation('home')">
                    <img class="brand-logo-img special-logo" src="logo.png" alt="لوگو"
                         onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 120 120\'%3E%3Cdefs%3E%3ClinearGradient id=\'grad\' x1=\'0%25\' y1=\'0%25\' x2=\'100%25\' y2=\'100%25\'%3E%3Cstop offset=\'0%25\' stop-color=\'%2347c8e0\'/%3E%3Cstop offset=\'100%25\' stop-color=\'%231a6d8f\'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=\'60\' cy=\'60\' r=\'50\' fill=\'url(%23grad)\' stroke=\'%23ffffff\' stroke-width=\'3\'/%3E%3Cpath fill=\'%23ffffff\' d=\'M40 40h40v8H40zM40 54h40v8H40zM40 68h25v8H40z\'/%3E%3Cpath fill=\'%23ffffff\' d=\'M80 45l12-8v30l-12-8z\' opacity=\'0.9\'/%3E%3C/svg%3E';">
                </div>
                <div class="desktop-menu">
                    <a href="#" class="nav-link-custom" data-nav="home"><i class="fas fa-home"></i> خانه</a>
                    <a href="#" class="nav-link-custom" data-nav="books"><i class="fas fa-book"></i> کتاب‌ها</a>
                    <a href="#" class="nav-link-custom" data-nav="podcasts"><i class="fas fa-podcast"></i> پادکست‌ها</a>

                    <span class="brand-text-mobile">ocean book</span>

</header>

<div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()"></div>

    <div class="sidebar-brand">
        <img src="logo.png" alt="لوگو"
             onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 120 120\'%3E%3Cdefs%3E%3ClinearGradient id=\'grad\' x1=\'0%25\' y1=\'0%25\' x2=\'100%25\' y2=\'100%25\'%3E%3Cstop offset=\'0%25\' stop-color=\'%2347c8e0\'/%3E%3Cstop offset=\'100%25\' stop-color=\'%231a6d8f\'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=\'60\' cy=\'60\' r=\'50\' fill=\'url(%23grad)\' stroke=\'%23ffffff\' stroke-width=\'3\'/%3E%3Cpath fill=\'%23ffffff\' d=\'M40 40h40v8H40zM40 54h40v8H40zM40 68h25v8H40z\'/%3E%3Cpath fill=\'%23ffffff\' d=\'M80 45l12-8v30l-12-8z\' opacity=\'0.9\'/%3E%3C/svg%3E';">
        <h2>ocean book</h2>
    </div>
    <a href="#" class="menu-item" data-nav="home"><i class="fas fa-home"></i> خانه</a>
    <a href="#" class="menu-item" data-nav="books"><i class="fas fa-book"></i> کتاب‌ها</a>
    <a href="#" class="menu-item" data-nav="podcasts"><i class="fas fa-podcast"></i> پادکست‌ها</a>
    <a href="#" class="menu-item" data-nav="audiobooks"><i class="fas fa-headphones"></i> کتاب صوتی</a>

    <a href="#" class="menu-item" data-nav="dashboard"><i class="fas fa-chart-line"></i> داشبورد</a>
    <a href="#" class="menu-item" onclick="goToCart()"><i class="fas fa-shopping-cart"></i> سبد خرید</a>

<main class="container-custom cart-main">
    <div class="row g-4">
        <div class="col-lg-8">
            <div id="cart-items-container">
                <div class="text-center py-5" id="loading-cart">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">بارگذاری سبد خرید...</p>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-2">
                <button id="clear-cart-btn" class="btn-secondary-clear btn btn-sm"><i class="fas fa-trash-alt"></i> حذف همه موارد</button>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="summary-card">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <i class="fas fa-water" style="color: #2897b5; font-size: 1.6rem;"></i>
                    <span class="summary-title fs-5">خلاصه فاکتور</span>
                </div>
                <div id="cart-summary">
                    <div class="d-flex justify-content-between">
                        <span>جمع اقلام:</span>
                        <span id="total-items-count">0</span>
                    </div>
                    <div class="d-flex justify-content-between mt-2">
                        <span>مجموع (تومان):</span>
                        <span id="total-price-summary">0</span>
                    </div>
                    <div class="total-row d-flex justify-content-between">
                        <span>قابل پرداخت:</span>
                        <span id="final-total">0</span>
                    </div>

                <button id="checkout-btn" class="btn-checkout"><i class="fas fa-ship" style="margin-left: 8px;"></i> ادامه فرآیند خرید</button>

<iframe src="footer.html" id="footerIframe" class="footer-iframe" scrolling="no"></iframe>

<script>
    function sendNavigation(target, section) {
        const pageMap = {
            'home': 'index.html',
            'all-products': 'all-products.html',
            'meditation': 'meditation.html',
            'dashboard': 'dashboard.html',
            'faq': 'FAQ.html',
            'rules': 'Rules.html',
            'about': 'aboutUs.html'
        };
        let url = pageMap[target] || 'index.html';
        if (target === 'all-products' && section) {
            url = url + '#' + section;
        }
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'navigate', target: target, section: section }, '*');
        }
        window.location.href = url;
    }

    function goToCart() {
        window.location.href = 'sabad.html';
    }

    function toggleMobileMenu() {
        const overlay = document.getElementById('mobileMenuOverlay');
        const sidebar = document.getElementById('mobileSidebar');
        if (sidebar.classList.contains('open')) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }
    }

    function openMobileMenu() {
        const overlay = document.getElementById('mobileMenuOverlay');
        const sidebar = document.getElementById('mobileSidebar');
        overlay.classList.add('active');
        sidebar.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
        const overlay = document.getElementById('mobileMenuOverlay');
        const sidebar = document.getElementById('mobileSidebar');
        overlay.classList.remove('active');
        sidebar.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.desktop-menu .nav-link-custom').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                const navType = this.getAttribute('data-nav');
                if (navType === 'dashboard') {
                    window.location.href = 'dashboard.html';
                    return;
                }
                if (this.id === 'cartDesktopBtn') {
                    goToCart();
                    return;
                }
                if (navType === 'home') sendNavigation('home');
                else if (navType === 'books') sendNavigation('all-products', 'books');
                else if (navType === 'podcasts') sendNavigation('all-products', 'podcasts');
                else if (navType === 'audiobooks') sendNavigation('all-products', 'audiobooks');
                else if (navType === 'meditation') sendNavigation('meditation');
            });
        });

        document.querySelectorAll('.mobile-sidebar .menu-item').forEach(el => {
            el.addEventListener('click', function(e) {
                const navType = this.getAttribute('data-nav');
                if (navType) {
                    e.preventDefault();
                    closeMobileMenu();
                    if (navType === 'dashboard') {
                        setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
                        return;
                    }
                    setTimeout(() => {
                        if (navType === 'home') sendNavigation('home');
                        else if (navType === 'books') sendNavigation('all-products', 'books');
                        else if (navType === 'podcasts') sendNavigation('all-products', 'podcasts');
                        else if (navType === 'audiobooks') sendNavigation('all-products', 'audiobooks');
                        else if (navType === 'meditation') sendNavigation('meditation');
                    }, 300);
                }
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeMobileMenu(); }
        });
    });

    function createBubbles() {
        const container = document.getElementById('bubbleContainer');
        if (!container) return;
        container.innerHTML = '';
        const count = window.innerWidth <= 768 ? 20 : 40;
        for (let i = 0; i < count; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = (window.innerWidth <= 768 ? 4 : 6) + Math.random() * 20;
            const duration = 5 + Math.random() * 12;
            const delay = Math.random() * 15;
            bubble.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${duration}s;animation-delay:${delay}s;`;
            container.appendChild(bubble);
        }
    }
    createBubbles();
    window.addEventListener('resize', () => { createBubbles(); resizeCanvas(); });

    const canvas = document.getElementById('oceanCanvas');
    let ctx = canvas.getContext('2d'), width, height, timeOffset = 0;
    
    function resizeCanvas() { 
        width = window.innerWidth; 
        height = 160; 
        canvas.width = width; 
        canvas.height = height; 
        drawWaves(); 
    }
    
    function drawWaves() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        
        ctx.beginPath();
        for (let x = 0; x <= width; x += 8) { 
            let y = height * 0.45 + Math.sin(x * 0.008 + timeOffset) * 14; 
            if (x === 0) ctx.moveTo(x, y); 
            else ctx.lineTo(x, y); 
        }
        ctx.fillStyle = '#0b5f7a'; 
        ctx.fill();
        
        ctx.beginPath();
        for (let x = 0; x <= width; x += 8) { 
            let y = height * 0.6 + Math.sin(x * 0.012 + timeOffset * 1.2) * 10; 
            if (x === 0) ctx.moveTo(x, y); 
            else ctx.lineTo(x, y); 
        }
        ctx.fillStyle = 'rgba(25, 120, 155, 0.9)'; 
        ctx.fill();
        
        ctx.beginPath();
        for (let x = 0; x <= width; x += 10) { 
            let y = height * 0.72 + Math.sin(x * 0.018 + timeOffset * 1.8) * 6; 
            if (x === 0) ctx.moveTo(x, y); 
            else ctx.lineTo(x, y); 
        }
        ctx.fillStyle = 'rgba(71, 200, 230, 0.4)'; 
        ctx.fill();
    }
    
    function animateWaves() { 
        timeOffset += 0.006; 
        drawWaves(); 
        requestAnimationFrame(animateWaves); 
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateWaves();

    function updateFooterHeight(height) {
        const iframe = document.getElementById('footerIframe');
        if (iframe && height) {
            const finalHeight = Math.max(height, 200);
            iframe.style.height = finalHeight + 'px';
            iframe.style.minHeight = finalHeight + 'px';
        }
    }

    function requestFooterHeight() {
        const iframe = document.getElementById('footerIframe');
        if (iframe && iframe.contentWindow) {
            try {
                iframe.contentWindow.postMessage({ type: 'requestHeight' }, '*');
            } catch(e) {}
        }
    }

    window.addEventListener('message', function(event) {
        if ((event.data.type === 'footerResize' || event.data.type === 'resize') && event.data.height) {
            updateFooterHeight(event.data.height);
        }
        if (event.data.type === 'navigate') {
            const target = event.data.target;
            const section = event.data.section;
            if (target === 'home') {
                window.location.href = 'index.html';
            } else if (target === 'all-products' || target === 'books' || target === 'podcasts' || target === 'audiobooks') {
                let hash = '';
                if (section === 'books' || target === 'books') hash = '#books';
                else if (section === 'podcasts' || target === 'podcasts') hash = '#podcasts';
                else if (section === 'audiobooks' || target === 'audiobooks') hash = '#audiobooks';
                window.location.href = 'all-products.html' + hash;
            } else if (target === 'meditation') {
                window.location.href = 'meditation.html';
            } else if (target === 'dashboard') {
                window.location.href = 'dashboard.html';
            } else if (target === 'faq') {
                window.location.href = 'FAQ.html';
            } else if (target === 'rules') {
                window.location.href = 'Rules.html';
            } else if (target === 'about') {
                window.location.href = 'aboutUs.html';
            }
        }
        if (event.data.type === 'openMobileMenu') {
            openMobileMenu();
        }
        if (event.data.type === 'closeMobileMenu') {
            closeMobileMenu();
        }
    });

    function showToast(message, isError = false) {
        const existingToast = document.querySelector('.cart-toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = `cart-toast ${isError ? 'error' : ''}`;
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(-100px)';
            toast.style.transition = 'all 0.5s ease';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    const CART_STORAGE_KEY = 'sea_cart_items';
    let cartItems = [];

    function saveCartToLocal() {
        try {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cartItems));
        } catch(e) {
            console.error('Error saving cart:', e);
        }
    }

    function loadCartFromLocal() {
        const stored = localStorage.getItem(CART_STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) cartItems = parsed;
                else cartItems = [];
            } catch(e) { 
                cartItems = []; 
            }
        } else { 
            cartItems = []; 
        }
    }

    function getIconByType(type) {
        const icons = { 
            'book': 'fa-book-open', 
            'podcast': 'fa-head-side-vr', 
            'audiobook': 'fa-headphones' 
        };
        return icons[type] || 'fa-book';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderCart() {
        const container = document.getElementById("cart-items-container");
        if (!container) return;
        
        if (cartItems.length === 0) {
            container.innerHTML = `
                <div class="empty-cart">
                    <i class="fas fa-box-open" style="font-size: 3rem; color: #588aa3;"></i>
                    <h4 class="mt-3 fw-bold" style="color:#175e7a;">سبد خرید شما خالی است</h4>
                    <p>کتاب‌ها، پادکست‌ها و کتاب‌های صوتی جذاب منتظر شما هستند.</p>
                    <a href="all-products.html" class="btn btn-outline-primary rounded-pill mt-2" style="border-color:#2697b5; color:#115e7c;">مشاهده فروشگاه</a>
                </div>
            `;
            updateSummary();
            return;
        }
        
        let html = '';
        for (let item of cartItems) {
            const itemTotal = (item.price || 0) * (item.quantity || 0);
            const priceDisplay = typeof item.price === 'number' ? item.price.toLocaleString() : '0';
            const totalDisplay = typeof itemTotal === 'number' ? itemTotal.toLocaleString() : '0';
            const itemId = escapeHtml(String(item.id));
            const itemType = escapeHtml(String(item.type));
            
            html += `
                <div class="product-card" data-id="${itemId}" data-type="${itemType}">
                    <div class="cart-item-row">
                        <div class="cart-item-col-image">
                            <div class="product-img">
                                ${item.cover ? `<img src="${escapeHtml(item.cover)}" alt="${escapeHtml(item.title)}">` : `<i class="fas ${item.iconClass || 'fa-book'}"></i>`}
                            </div>
                        </div>
                        
                        <div class="cart-item-col-info">
                            <div class="product-title">${escapeHtml(item.title)}</div>
                            <div class="product-category mt-1">${escapeHtml(item.category || 'محصول')}</div>
                            <div class="small text-secondary mt-1">قیمت واحد: ${priceDisplay} تومان</div>
                        </div>
                        
                        <div class="cart-item-col-quantity">
                            <div class="quantity-control">
                                <button class="quantity-btn dec-qty" data-id="${itemId}" data-type="${itemType}">−</button>
                                <span class="quantity-num">${item.quantity || 0}</span>
                                <button class="quantity-btn inc-qty" data-id="${itemId}" data-type="${itemType}">+</button>
                            </div>
                        </div>
                        
                        <div class="cart-item-col-price">
                            <div class="price-text">${totalDisplay}</div>
                            <small class="text-muted">تومان</small>
                        </div>
                        
                        <div class="cart-item-col-remove">
                            <button class="remove-item" data-id="${itemId}" data-type="${itemType}" title="حذف کالا">
                                <i class="fas fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        updateSummary();
    }

    const cartContainer = document.getElementById("cart-items-container");
    if (cartContainer) {
        cartContainer.addEventListener('click', function(e) {
            const target = e.target.closest('button');
            if (!target) return;
            
            const id = target.getAttribute('data-id');
            const type = target.getAttribute('data-type');
            if (!id || !type) return;
            
            const itemIndex = cartItems.findIndex(i => String(i.id) === String(id) && String(i.type) === String(type));
            if (itemIndex === -1) return;
            
            if (target.classList.contains('dec-qty')) {
                if (cartItems[itemIndex].quantity > 1) {
                    cartItems[itemIndex].quantity -= 1;
                    saveCartToLocal();
                    renderCart();
                } else {
                    if (confirm('آیا مایل به حذف این محصول از سبد خرید هستید؟')) {
                        cartItems.splice(itemIndex, 1);
                        saveCartToLocal();
                        renderCart();
                        showToast('محصول از سبد خرید حذف شد');
                    }
                }
            } else if (target.classList.contains('inc-qty')) {
                cartItems[itemIndex].quantity = (cartItems[itemIndex].quantity || 0) + 1;
                saveCartToLocal();
                renderCart();
            } else if (target.classList.contains('remove-item')) {
                if (confirm('محصول از سبد خرید حذف شود؟')) {
                    cartItems.splice(itemIndex, 1);
                    saveCartToLocal();
                    renderCart();
                    showToast('محصول از سبد خرید حذف شد');
                }
            }
        });
    }

    function updateSummary() {
        const totalItems = cartItems.reduce((sum, item) => sum + (item.quantity || 0), 0);
        const totalPrice = cartItems.reduce((sum, item) => sum + ((item.price || 0) * (item.quantity || 0)), 0);
        
        const totalItemsEl = document.getElementById("total-items-count");
        const totalPriceEl = document.getElementById("total-price-summary");
        const finalTotalEl = document.getElementById("final-total");
        
        if (totalItemsEl) totalItemsEl.innerText = totalItems;
        if (totalPriceEl) totalPriceEl.innerText = totalPrice.toLocaleString();
        if (finalTotalEl) finalTotalEl.innerText = totalPrice.toLocaleString();
    }

    function clearFullCart() {
        if (cartItems.length === 0) { 
            showToast('سبد خرید در حال حاضر خالی است', true);
            return; 
        }
        if (confirm('همه آیتم‌های سبد خرید حذف خواهند شد. ادامه می‌دهید؟')) {
            cartItems = [];
            saveCartToLocal();
            renderCart();
            showToast('همه موارد از سبد خرید حذف شد');
        }
    }

    function handleCheckout() {
        if (cartItems.length === 0) {
            showToast('سبد خرید شما خالی است. لطفا محصولات مورد نظر را افزوده و سپس اقدام به خرید کنید.', true);
        } else {
            localStorage.setItem('checkout_items', JSON.stringify(cartItems));
            window.location.href = 'payment.html';
        }
    }

    function checkForProductFromQuery() {
        const urlParams = new URLSearchParams(window.location.search);
        const addId = urlParams.get('add_id');
        const addType = urlParams.get('add_type');
        const addTitle = urlParams.get('add_title');
        const addCategory = urlParams.get('add_category');
        const addPrice = urlParams.get('add_price');
        
        if (addId && addType && addTitle) {
            const product = {
                id: addId,
                type: addType,
                title: decodeURIComponent(addTitle),
                category: addCategory ? decodeURIComponent(addCategory) : 
                    (addType === 'book' ? 'کتاب الکترونیک' : 
                    (addType === 'podcast' ? 'پادکست صوتی' : 'کتاب صوتی')),
                price: parseInt(addPrice) || 0,
                iconClass: getIconByType(addType),
                quantity: 1
            };
            
            window.history.replaceState({}, document.title, window.location.pathname);
            
            const existingItem = cartItems.find(item => String(item.id) === String(product.id) && String(item.type) === String(product.type));
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 0) + 1;
            } else {
                cartItems.push(product);
            }
            saveCartToLocal();
            renderCart();
            showToast(`محصول "${product.title}" به سبد خرید اضافه شد!`);
        }
    }

    function init() {
        loadCartFromLocal();
        renderCart();
        
        const clearBtn = document.getElementById("clear-cart-btn");
        const checkoutBtn = document.getElementById("checkout-btn");
        
        if (clearBtn) clearBtn.addEventListener("click", clearFullCart);
        if (checkoutBtn) checkoutBtn.addEventListener("click", handleCheckout);
        
        checkForProductFromQuery();
        setTimeout(requestFooterHeight, 500);
        setTimeout(requestFooterHeight, 1500);
        setTimeout(requestFooterHeight, 3000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
