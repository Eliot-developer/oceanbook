<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>فوتر </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
           background:none;
            font-family: 'Vazirmatn', 'Segoe UI', system-ui, sans-serif;
        }

        .wave-footer {
            background: linear-gradient(135deg, #022b3a, #1f6d8c);
            margin-top: 2rem;
            padding: 2.5rem 0 1.2rem 0;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 40px rgba(0, 119, 182, 0.2);
            position: relative;
            width: 100%;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 2rem 1.8rem;
            padding: 0.5rem 0 1.5rem 0;
        }

        .footer-col h4 {
            font-size: 0.95rem;
            margin-bottom: 1rem;
            color: #ffffff;
            font-weight: 600;
            border-right: 4px solid #ffffff;
            padding-right: 12px;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .footer-col ul { list-style: none; padding: 0; margin: 0; }
        .footer-col ul li { margin-bottom: 8px; }
        .footer-col ul li a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400;
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-block;
            padding: 2px 0;
            border-bottom: 1px solid transparent;
        }
        .footer-col ul li a:hover {
            color: #ffffff;
            padding-right: 6px;
            border-bottom-color: #ffffff;
            font-weight: 500;
            transform: translateX(-3px);
        }

        .footer-col p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
        }
        .footer-col p i {
            color: #ffffff;
            width: 22px;
            text-align: center;
            font-size: 0.95rem;
        }

        .footer-logo-link {
            cursor: pointer;
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
            text-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .footer-logo-link i {
            color: #ffffff;
            font-size: 1.6rem;
        }
        .footer-logo-link:hover {
            color: #ffffff;
            transform: scale(1.02);
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .footer-social {
            display: flex;
            gap: 0.8rem;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .footer-social a {
            color: #ffffff;
            font-size: 1.2rem;
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }
        .footer-social a:hover {
            color: #0077b6;
            background: #ffffff;
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.3);
        }

        .copyright {
            text-align: center;
            padding: 1rem 0 0.8rem 0;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.3px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 50px;
        }
        .copyright i {
            color: #ffffff;
            margin: 0 4px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        @media (max-width: 768px) {
            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.8rem 1rem;
            }
            .footer-col h4 { font-size: 0.85rem; }
            .footer-col ul li a { font-size: 0.7rem; }
            .footer-social a { width: 34px; height: 34px; font-size: 1rem; }
            .wave-footer { padding: 2rem 0 0.8rem 0; border-radius: 20px 20px 0 0; }
        }

        @media (max-width: 480px) {
            .footer-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .footer-col h4 {
                border-right: none;
                border-bottom: 2px solid #ffffff;
                padding-right: 0;
                padding-bottom: 8px;
                display: inline-block;
            }
            .footer-col p { justify-content: center; }
            .footer-social { justify-content: center; }
            .footer-col ul li a:hover { padding-right: 0; transform: none; }
            .wave-footer { border-radius: 15px 15px 0 0; }
        }
    </style>
</head>
<body>
    <footer class="wave-footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h4 class="footer-logo-link" id="footerLogo">
                        OCEAN BOOK
                    </h4>
                    
                    <div class="footer-social">
                        <a href="#" class="social-link" data-social="instagram"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="social-link" data-social="telegram"><i class="fab fa-telegram"></i></a>
                        <a href="#" class="social-link" data-social="spotify"><i class="fab fa-spotify"></i></a>
                        <a href="#" class="social-link" data-social="youtube"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>

                <div class="footer-col">
                    <h4>دسترسی سریع</h4>
                    <ul>
                        <li><a class="footer-nav-link" data-nav="home">خانه</a></li>
                        <li><a class="footer-nav-link" data-nav="books">کتاب‌ها</a></li>
                        <li><a class="footer-nav-link" data-nav="podcasts">پادکست‌ها</a></li>
                        <li><a class="footer-nav-link" data-nav="audiobooks">کتاب صوتی</a></li>
                        <li><a class="footer-nav-link" data-nav="meditation">مدیتیشن</a></li>
                    </ul>
                </div>

                <div class="footer-col">
                    <h4>خدمات</h4>
                    <ul>
                        <li><a class="footer-nav-link" data-nav="faq">سوالات متداول</a></li>
                        <li><a class="footer-nav-link" data-nav="rules">قوانین</a></li>
                        <li><a href="aboutUs.html" target="_top" onclick="return true;">درباره ما</a></li>
                         <li><a href="login.html" target="_top" onclick="return true;">ورود به حساب</a></li>
                    </ul>
                </div>

                <div class="footer-col contact-info">
                    <h4>تماس با ما</h4>
                    <p><i class="fas fa-envelope"></i> OceanBook@gmail.com</p>
                    <p><i class="fas fa-phone-alt"></i> 09122537290</p>
                    <p><i class="fas fa-map-marker-alt"></i> قم، خیابان کتاب</p>
                </div>
            </div>

            <div class="copyright">
                <i class="fas fa-book-open"></i> © 2026 OCEAN BOOK | تمامی حقوق محفوظ است
                <i class="fas fa-water" style="margin-right:8px;"></i>
            </div>
        </div>
    </footer>

    <script>
        function sendNavigation(target, section = null) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'navigate', target: target, section: section }, '*');
            } else {
                handleNavigationDirect(target, section);
            }
        }

        function handleNavigationDirect(target, section = null) {
            if (target === 'home') {
                window.location.href = 'index.html';
            } else if (target === 'all-products' || target === 'books' || target === 'podcasts' || target === 'audiobooks') {
                let hash = '';
                if (section === 'books' || target === 'books') hash = '#books';
                else if (section === 'podcasts' || target === 'podcasts') hash = '#podcasts';
                else if (section === 'audiobooks' || target === 'audiobooks') hash = '#audiobooks';
                window.location.href = 'all-products.html' + hash;
            } else if (target === 'meditation') {
                window.location.href = 'meditation.html';
            } else if (target === 'about') {
                window.location.href = 'signUp.html';
            } else if (target === 'rules') {
                window.location.href = 'Rules.html';
            } else if (target === 'faq') {
                window.location.href = 'FAQ.html';
            } else if (target === 'dashboard') {
                window.location.href = 'dashboard.html';
            } else if (target === 'account') {
                window.location.href = 'account.html';
            } else if (target === 'contact') {
                window.location.href = 'contact.html';
            } else {
                alert('صفحه ' + target + ' به زودی اضافه می‌شود');
            }
        }

        function sendSocialLink(social) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'socialLink', social: social }, '*');
            } else {
                alert('لینک ' + social + ' باز می‌شود');
            }
        }

        document.querySelectorAll('.footer-nav-link').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                const navType = this.getAttribute('data-nav');

                if (navType === 'home') sendNavigation('home');
                else if (navType === 'books') sendNavigation('all-products', 'books');
                else if (navType === 'podcasts') sendNavigation('all-products', 'podcasts');
                else if (navType === 'audiobooks') sendNavigation('all-products', 'audiobooks');
                else if (navType === 'meditation') sendNavigation('meditation');
                else if (navType === 'about') sendNavigation('about');
                else if (navType === 'rules') sendNavigation('rules');
                else if (navType === 'faq') sendNavigation('faq');
                else if (navType === 'dashboard') sendNavigation('dashboard');
                else if (navType === 'account') sendNavigation('account');
                else if (navType === 'contact') sendNavigation('contact');
                else {
                    sendNavigation(navType);
                }
            });
        });

        document.querySelectorAll('.social-link').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                const social = this.getAttribute('data-social');
                sendSocialLink(social);
            });
        });

        document.getElementById('footerLogo')?.addEventListener('click', function(e) {
            e.preventDefault();
            sendNavigation('home');
        });

        let lastSentHeight = 0;
        let heightTimeout = null;
        let isSending = false;

        function sendHeight() {
            if (isSending) return;
            
            if (heightTimeout) {
                clearTimeout(heightTimeout);
                heightTimeout = null;
            }

            heightTimeout = setTimeout(() => {
                isSending = true;
                
                try {
                    const bodyHeight = document.body.scrollHeight;
                    const footerHeight = document.querySelector('.wave-footer')?.scrollHeight || 0;
                    const containerHeight = document.querySelector('.container')?.scrollHeight || 0;
                    
                    const height = Math.max(bodyHeight, footerHeight, containerHeight, 200) + 10;
                    
                    if (Math.abs(height - lastSentHeight) > 5) {
                        lastSentHeight = height;
                        
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ 
                                type: 'footerResize', 
                                height: height 
                            }, '*');
                            console.log(' ارتفاع فوتر ارسال شد:', height);
                        } else {
                            const iframe = window.frameElement;
                            if (iframe) {
                                iframe.style.height = height + 'px';
                            }
                        }
                    }
                } catch (error) {
                    console.warn('خطا در ارسال ارتفاع:', error);
                } finally {
                    isSending = false;
                    heightTimeout = null;
                }
            }, 100);
        }

        function initialSend() {
            sendHeight();
        }

        if (document.readyState === 'complete') {
            setTimeout(initialSend, 100);
            setTimeout(initialSend, 300);
            setTimeout(initialSend, 600);
            setTimeout(initialSend, 1000);
        } else {
            window.addEventListener('load', () => {
                setTimeout(initialSend, 100);
                setTimeout(initialSend, 300);
                setTimeout(initialSend, 600);
                setTimeout(initialSend, 1000);
            });
        }

        let mutationTimeout = null;
        const mutationObserver = new MutationObserver(() => {
            if (mutationTimeout) {
                clearTimeout(mutationTimeout);
            }
            mutationTimeout = setTimeout(() => {
                sendHeight();
                mutationTimeout = null;
            }, 200);
        });

        const footerElement = document.querySelector('.wave-footer');
        if (footerElement) {
            mutationObserver.observe(footerElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['style', 'class', 'height']
            });
        }

        let resizeTimeout = null;
        window.addEventListener('resize', () => {
            if (resizeTimeout) {
                clearTimeout(resizeTimeout);
            }
            resizeTimeout = setTimeout(() => {
                sendHeight();
                resizeTimeout = null;
            }, 200);
        });

        if (document.fonts) {
            document.fonts.ready.then(() => {
                setTimeout(sendHeight, 300);
            });
        }

        window.addEventListener('message', (e) => {
            if (e.data.type === 'requestHeight') {
                sendHeight();
            }
            if (e.data.type === 'getFooterInfo') {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ 
                        type: 'footerInfo', 
                        height: document.body.scrollHeight 
                    }, '*');
                }
            }
        });

        let scrollTimeout = null;
        window.addEventListener('scroll', () => {
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }
            scrollTimeout = setTimeout(() => {
                sendHeight();
                scrollTimeout = null;
            }, 300);
        }, { passive: true });

        document.querySelectorAll('.footer-nav-link, .social-link, #footerLogo').forEach(el => {
            el.addEventListener('click', () => {
                setTimeout(sendHeight, 100);
            });
        });

        console.log(' فوتر بارگذاری شد  ');
    </script>
</body>
</html>
